<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AlwalluL | Links</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #F5EFE1;
      --accent-color: #AEC4D4;
      --accent-hover: #8AABC1;
      --card-bg: rgba(255, 255, 255, 0.7);
      --card-border: rgba(174, 196, 212, 0.4);
      --text-main: #2D3748;
      --text-muted: #64748B;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem 1rem;
      position: relative;
      overflow-x: hidden;
    }

    .bg-shape {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      z-index: 0;
    }

    .shape-1 {
      width: 320px;
      height: 320px;
      background: var(--accent-color);
      top: -60px;
      left: -60px;
      opacity: 0.55;
    }

    .shape-2 {
      width: 280px;
      height: 280px;
      background: #D8E4EC;
      bottom: -50px;
      right: -50px;
      opacity: 0.65;
    }

    .container {
      width: 100%;
      max-width: 440px;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .profile-card {
      text-align: center;
      margin-bottom: 2rem;
    }

    .profile-img-container {
      position: relative;
      width: 110px;
      height: 110px;
      margin: 0 auto 1.2rem auto;
    }

    .profile-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      border: 3px solid #FFF;
      box-shadow: 0 8px 25px rgba(174, 196, 212, 0.6);
    }

    .profile-title {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #1A202C;
    }

    .profile-subtitle {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-top: 0.3rem;
      font-weight: 500;
    }

    .links-wrapper {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
    }

    .link-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      padding: 1rem 1.25rem;
      border-radius: 18px;
      display: flex;
      align-items: center;
      text-decoration: none;
      color: var(--text-main);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.02);
      cursor: pointer;
    }

    .link-card:hover {
      transform: translateY(-3px);
      background: rgba(255, 255, 255, 0.92);
      border-color: var(--accent-color);
      box-shadow: 0 8px 25px rgba(174, 196, 212, 0.35);
    }

    .icon-box {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: var(--accent-color);
      color: #FFF;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      margin-right: 1rem;
      flex-shrink: 0;
    }

    .link-info {
      flex-grow: 1;
    }

    .link-title {
      font-weight: 600;
      font-size: 0.95rem;
    }

    .link-sub {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .arrow-icon {
      color: var(--text-muted);
      font-size: 0.9rem;
      transition: transform 0.3s ease;
    }

    .link-card:hover .arrow-icon {
      transform: translateX(4px);
      color: var(--text-main);
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(4px);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
      z-index: 100;
      padding: 1rem;
    }

    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .modal-content {
      background: #FFF;
      padding: 1.8rem;
      border-radius: 24px;
      width: 100%;
      max-width: 360px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.1);
      transform: scale(0.9);
      transition: transform 0.3s ease;
    }

    .modal-overlay.active .modal-content {
      transform: scale(1);
    }

    .copy-box {
      background: var(--bg-color);
      padding: 0.75rem 1rem;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 1.2rem 0;
      border: 1px dashed var(--accent-color);
    }

    .copy-btn {
      background: var(--accent-color);
      color: #FFF;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.8rem;
      transition: background 0.2s ease;
    }

    .copy-btn:hover {
      background: var(--accent-hover);
    }

    .close-btn {
      background: transparent;
      border: 1px solid #E2E8F0;
      padding: 0.5rem 1.2rem;
      border-radius: 10px;
      color: var(--text-muted);
      cursor: pointer;
      font-weight: 500;
      font-size: 0.85rem;
    }

    .toast {
      position: fixed;
      bottom: 25px;
      background: #2D3748;
      color: #FFF;
      padding: 0.75rem 1.5rem;
      border-radius: 30px;
      font-size: 0.85rem;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.3s ease;
      z-index: 200;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <div class="bg-shape shape-1"></div>
  <div class="bg-shape shape-2"></div>

  <div class="container">
    <div class="profile-card">
      <div class="profile-img-container">
        <img src="https://i.imgur.com/PQuombg.jpg" alt="AlwalluL Profile" class="profile-img">
      </div>
      <h1 class="profile-title">AlwalluL</h1>
      <p class="profile-subtitle">Nevertheles ✨</p>
    </div>

    <div class="links-wrapper">
      <a href="https://instagram.com/_alwallul29j" target="_blank" class="link-card">
        <div class="icon-box"><i class="fa-brands fa-instagram"></i></div>
        <div class="link-info">
          <div class="link-title">Instagram</div>
          <div class="link-sub">@_alwallul29j</div>
        </div>
        <i class="fa-solid fa-arrow-right arrow-icon"></i>
      </a>

      <a href="https://tiktok.com/@jayeon290" target="_blank" class="link-card">
        <div class="icon-box"><i class="fa-brands fa-tiktok"></i></div>
        <div class="link-info">
          <div class="link-title">TikTok</div>
          <div class="link-sub">@jayeon290</div>
        </div>
        <i class="fa-solid fa-arrow-right arrow-icon"></i>
      </a>

      <a href="https://music.apple.com/id/playlist/pl.u-yZyVEyZtZLo4y49" target="_blank" class="link-card">
        <div class="icon-box"><i class="fa-solid fa-music"></i></div>
        <div class="link-info">
          <div class="link-title">Apple Music Playlist</div>
          <div class="link-sub">Dengarkan Playlist Favorit</div>
        </div>
        <i class="fa-solid fa-arrow-right arrow-icon"></i>
      </a>

      <div class="link-card" onclick="openMlModal()">
        <div class="icon-box"><i class="fa-solid fa-gamepad"></i></div>
        <div class="link-info">
          <div class="link-title">Mobile Legends</div>
          <div class="link-sub">ID: 203652127 (Jayeon)</div>
        </div>
        <i class="fa-solid fa-copy arrow-icon"></i>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="mlModal">
    <div class="modal-content">
      <h3 style="font-size: 1.1rem; margin-bottom: 0.3rem;">Mobile Legends ID</h3>
      <p style="font-size: 0.85rem; color: var(--text-muted);">Username: <b>Jayeon</b></p>
      
      <div class="copy-box">
        <span id="mlId" style="font-weight: 600; font-size: 0.95rem;">203652127</span>
        <button class="copy-btn" onclick="copyMlId()">Copy</button>
      </div>

      <button class="close-btn" onclick="closeMlModal()">Tutup</button>
    </div>
  </div>

  <div class="toast" id="toast">ID berhasil disalin!</div>

  <script>
    function openMlModal() {
      document.getElementById('mlModal').classList.add('active');
    }

    function closeMlModal() {
      document.getElementById('mlModal').classList.remove('active');
    }

    function copyMlId() {
      const idText = document.getElementById('mlId').innerText;
      navigator.clipboard.writeText(idText);
      
      const toast = document.getElementById('toast');
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 2000);
    }
  </script>
</body>
</html>
